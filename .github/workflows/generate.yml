name: Generate OER Catalog HTML

on:
  push:
    paths:
      - "data/*.xlsx"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate HTML for all workbooks
        run: |
          for f in data/*.xlsx; do
            python3 generate.py "$f"
          done

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --cached --quiet || git commit -m "Regenerate catalog HTML from updated workbooks"
          git push

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Build failed: ${{ github.workflow }}"
          if gh issue list --state open --search "$TITLE" --json title | grep -qF "$TITLE"; then
            echo "Issue already open, skipping."
          else
            gh issue create \
              --title "$TITLE" \
              --body "The **${{ github.workflow }}** workflow failed.

**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
**Triggered by:** \`${{ github.actor }}\` pushing to \`${{ github.ref_name }}\`

Please check the run log for details. Close this issue once resolved."
          fi
